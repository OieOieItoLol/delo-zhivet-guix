server {
    listen 443 ssl;
    server_name delo-zhivet.orgnarod.su;

    client_max_body_size 10M;

    # Корень для статики — стандартный путь nginx
    root /usr/share/nginx/html;
    index index.html;


    # SSL сертификаты (путь внутри контейнера)
    ssl_certificate /etc/nginx/certs/delo-zhivet.orgnarod.su.crt;
    ssl_certificate_key /etc/nginx/certs/delo-zhivet.orgnarod.su.key;

    # Настройки SSL (можно добавить свои параметры)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss;

    # Кэширование статики
    location ~* \.(js|css|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: если файл не найден — отдаём index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API → backend (используем имя сервиса в Docker сети)
    location /api {
        proxy_pass http://backend:9966;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Изображения → backend
    location /images {
        expires 1y;
        proxy_pass http://backend:9966;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Блок HTTP можно убрать, если xRay всегда шлёт HTTPS
# Но оставим для порядка — возвращаем 404 на прямой HTTP
server {
    listen 80 default_server;
    server_name delo-zhivet.orgnarod.su;
    return 404;
}
